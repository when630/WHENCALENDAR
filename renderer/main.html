<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'"
    />
    <link href="./tokens.css" rel="stylesheet" />
    <title>WHENCALENDAR</title>
    <style>
      html,
      body {
        height: 100%;
        background: var(--bg-app);
        overflow: hidden;
        font-family: var(--font-sans);
        font-size: var(--fs-md);
        line-height: 1.5;
        color: var(--text-primary);
        -webkit-user-select: none;
      }
      .app {
        display: flex;
        flex-direction: column;
        height: 100%;
      }

      /* 제목 표시줄이 없으므로 헤더가 곧 드래그 바다 — 여기를 잡아 창을 옮긴다 */
      header {
        display: flex;
        align-items: center;
        gap: var(--sp-4);
        padding: 6px 6px 6px var(--sp-4);
        border-bottom: 1px solid var(--border);
        flex: none;
        -webkit-app-region: drag;
      }
      .tabs,
      .winbtns {
        -webkit-app-region: no-drag;
      }
      .winbtns {
        display: flex;
        gap: 2px;
      }
      .winbtns button {
        width: 38px;
        height: 28px;
        border: none;
        background: none;
        color: var(--text-muted);
        cursor: default;
        display: grid;
        place-items: center;
        border-radius: var(--r-sm);
      }
      .winbtns button:hover {
        background: var(--bg-hover);
        color: var(--text-primary);
      }
      .winbtns button#winClose:hover {
        background: var(--danger);
        color: #fff;
      }
      header .title {
        font-size: var(--fs-xs);
        font-weight: 750;
        letter-spacing: 0.8px;
        color: var(--text-secondary);
        display: flex;
        align-items: center;
        gap: 7px;
      }
      header .title::before {
        content: '';
        width: 9px;
        height: 9px;
        border-radius: 99px;
        background: var(--accent);
        box-shadow: 0 0 9px var(--accent-dim);
      }
      header .date {
        color: var(--text-muted);
        font-size: var(--fs-xs);
        margin-left: auto;
        padding-right: var(--sp-2);
      }
      .tabs {
        display: flex;
        gap: 2px;
      }
      .tab {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 4px 11px;
        border-radius: var(--r-sm);
        font-size: var(--fs-sm);
        color: var(--text-muted);
      }
      .tab .n {
        font-size: 10.5px;
        padding: 0 5px;
        border-radius: 99px;
        background: var(--bg-inset);
        color: var(--text-muted);
      }
      .tab.on {
        color: var(--text-primary);
        background: var(--bg-hover);
      }
      .tab.on .n {
        background: var(--accent-dim);
        color: var(--accent);
      }

      .body {
        flex: 1;
        overflow-y: auto;
        padding: var(--sp-2) var(--sp-4) var(--sp-4);
      }

      footer {
        display: flex;
        align-items: center;
        gap: var(--sp-3);
        padding: 7px var(--sp-4);
        border-top: 1px solid var(--border);
        font-size: var(--fs-xs);
        color: var(--text-muted);
        flex: none;
      }
      .led {
        width: 7px;
        height: 7px;
        border-radius: 99px;
        background: var(--success);
        box-shadow: 0 0 7px rgba(158, 206, 106, 0.5);
        display: inline-block;
      }
      .led.err {
        background: var(--danger);
        box-shadow: 0 0 7px rgba(247, 118, 142, 0.5);
      }
      .foot-hints {
        margin-left: auto;
        display: flex;
        gap: 11px;
      }

      /* 시간축 */
      .seghead {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 11px 0 5px;
      }
      .seghead b {
        font-size: var(--fs-xs);
        color: var(--text-muted);
        font-weight: 640;
        letter-spacing: 0.3px;
      }
      .seghead i {
        flex: 1;
        height: 1px;
        background: var(--border);
      }

      .ev {
        display: flex;
        gap: var(--sp-3);
        align-items: flex-start;
        padding: 7px 9px;
        border-radius: var(--r-sm);
      }
      .ev:hover {
        background: var(--bg-raised);
      }
      .ev.sel {
        background: var(--accent-dim);
        box-shadow: inset 2px 0 0 var(--accent);
      }
      .ev .clock {
        font-family: var(--font-mono);
        font-size: var(--fs-xs);
        color: var(--text-secondary);
        width: 96px;
        flex: none;
        padding-top: 1px;
        letter-spacing: -0.2px;
      }
      .ev .bar {
        width: 3px;
        border-radius: 99px;
        background: var(--text-muted);
        flex: none;
        align-self: stretch;
        opacity: 0.5;
      }
      .ev .main {
        flex: 1;
        min-width: 0;
      }
      .ev .t {
        font-size: var(--fs-md);
      }
      .ev .sub {
        font-size: var(--fs-xs);
        color: var(--text-muted);
        margin-top: 2px;
      }
      .ev .rt {
        flex: none;
        font-size: var(--fs-xs);
        color: var(--text-muted);
        font-variant-numeric: tabular-nums;
        padding-top: 2px;
      }
      .ev.past .t,
      .ev.past .clock {
        color: var(--text-muted);
      }
      .ev.past .bar {
        opacity: 0.22;
      }
      .ev.live {
        background: var(--live-dim);
        box-shadow: inset 2px 0 0 var(--live);
      }
      .ev.live .bar {
        background: var(--live);
        opacity: 1;
      }
      .ev.live .rt {
        color: var(--live);
        font-weight: 650;
      }
      .ev.next .bar {
        background: var(--accent);
        opacity: 1;
      }
      .ev.next .rt {
        color: var(--accent);
        font-weight: 650;
      }

      .nowline {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 3px 0 3px 9px;
      }
      .nowline .bead {
        width: 7px;
        height: 7px;
        border-radius: 99px;
        background: var(--danger);
        flex: none;
        box-shadow: 0 0 8px rgba(247, 118, 142, 0.6);
      }
      .nowline .ln {
        flex: 1;
        height: 1px;
        background: linear-gradient(90deg, var(--danger), transparent);
      }
      .nowline .lbl {
        font-family: var(--font-mono);
        font-size: 10.5px;
        color: var(--danger);
        flex: none;
      }

      .wkday {
        padding: 12px 0 3px;
        display: flex;
        align-items: center;
        gap: 9px;
      }
      .wkday b {
        font-size: var(--fs-sm);
        font-weight: 640;
      }
      .wkday span {
        font-size: var(--fs-xs);
        color: var(--text-muted);
      }
      .wkday i {
        flex: 1;
        height: 1px;
        background: var(--border);
      }
      .wkday.today b {
        color: var(--accent);
      }

      .empty {
        height: 100%;
        min-height: 260px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: var(--sp-3);
        color: var(--text-muted);
      }
      .empty .big {
        font-size: 15px;
        color: var(--text-secondary);
      }
      .empty .hint {
        font-size: var(--fs-xs);
        line-height: 2;
        text-align: center;
      }

      /* 월 격자 */
      .mon {
        height: 100%;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .mon .dow {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 4px;
        padding-bottom: 5px;
        flex: none;
      }
      .mon .dow span {
        text-align: center;
        font-size: 10.5px;
        color: var(--text-muted);
      }
      .mon .dow span.we {
        color: #8a6f78;
      }
      .mon .cells {
        display: flex;
        flex-direction: column;
        gap: 4px;
        flex: 1;
        min-height: 0;
      }
      .mon .wkrow {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 4px;
        flex: 1;
        min-height: 0;
      }
      .mon .wkrow > .c {
        grid-row: 1;
      }
      .mon .c {
        background: var(--bg-inset);
        border: 1px solid transparent;
        border-radius: var(--r-sm);
        padding: 4px 5px;
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-height: 0;
        overflow: hidden;
        position: relative;
      }
      .mon .c.out {
        opacity: 0.32;
      }
      .mon .c.we .dnum {
        color: #8a6f78;
      }
      .mon .c.today {
        background: var(--accent-dim);
      }
      .mon .c.today .dnum {
        color: var(--accent);
        font-weight: 750;
      }
      .mon .c.sel {
        border-color: var(--accent);
        box-shadow: inset 2px 0 0 var(--accent);
      }
      .mon .dnum {
        font-size: 11px;
        color: var(--text-secondary);
        font-variant-numeric: tabular-nums;
      }
      .mon .pin {
        display: flex;
        align-items: center;
        gap: 4px;
        font-size: 9.5px;
        color: var(--text-secondary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        line-height: 1.55;
      }
      .mon .pin i {
        width: 3px;
        height: 9px;
        border-radius: 2px;
        flex: none;
      }
      .mon .plus {
        font-size: 9.5px;
        color: var(--text-muted);
      }
      /* 여러 날에 걸친 일정은 칸 위를 가로지른다. 레인은 두 줄까지(D-10) */
      .mon .wkrow.lane1 > .c {
        padding-top: 36px;
      }
      .mon .wkrow.lane2 > .c {
        padding-top: 54px;
      }
      .mon .wkrow.lane1 > .c > .dnum,
      .mon .wkrow.lane2 > .c > .dnum {
        position: absolute;
        top: 4px;
        left: 6px;
      }
      .mon .span {
        grid-row: 1;
        z-index: 2;
        align-self: start;
        margin-top: 18px;
        height: 15px;
        display: flex;
        align-items: center;
        gap: 5px;
        padding: 0 7px;
        border-radius: 4px;
        font-size: 9.5px;
        font-weight: 650;
        white-space: nowrap;
        overflow: hidden;
        color: #15171c;
      }
      .mon .span.l2 {
        margin-top: 36px;
      }
      .mon .span.contL {
        border-top-left-radius: 0;
        border-bottom-left-radius: 0;
        padding-left: 5px;
      }
      .mon .span.contR {
        border-top-right-radius: 0;
        border-bottom-right-radius: 0;
        padding-right: 5px;
      }
      .mon .span .ar {
        opacity: 0.55;
        font-size: 10px;
      }
      .mon .morespan {
        grid-row: 1;
        z-index: 3;
        align-self: start;
        margin-top: 36px;
        height: 15px;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        padding-right: 3px;
      }
      .mon .morespan span {
        font-size: 9.5px;
        font-weight: 650;
        color: var(--text-secondary);
        background: var(--bg-app);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 0 5px;
        line-height: 13px;
      }
      .mon .daybar {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 9px 2px 2px;
        border-top: 1px solid var(--border);
        margin-top: 8px;
        font-size: var(--fs-xs);
        flex: none;
      }
      .mon .daybar b {
        font-weight: 640;
        color: var(--text-secondary);
      }
      .mon .daybar .s {
        color: var(--text-muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      /* 구독 탭 */
      .sub {
        display: flex;
        align-items: center;
        gap: var(--sp-3);
        padding: 11px 10px;
        border-radius: var(--r-sm);
      }
      .sub.sel {
        background: var(--accent-dim);
        box-shadow: inset 2px 0 0 var(--accent);
      }
      .sub .sw {
        width: 9px;
        height: 9px;
        border-radius: 99px;
        flex: none;
      }
      .sub .main {
        flex: 1;
        min-width: 0;
      }
      .sub .nm {
        font-size: var(--fs-md);
      }
      .sub .url {
        font-family: var(--font-mono);
        font-size: 10.5px;
        color: var(--text-muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin-top: 2px;
      }
      .sub .st {
        font-size: var(--fs-xs);
        flex: none;
        color: var(--text-muted);
      }
      .sub .st.err {
        color: var(--danger);
      }
      .sub .st.load {
        color: var(--accent);
      }
      .sub .toggle {
        width: 30px;
        height: 17px;
        border-radius: 99px;
        background: var(--bg-hover);
        position: relative;
        flex: none;
        border: 1px solid var(--border);
      }
      .sub .toggle::after {
        content: '';
        position: absolute;
        width: 11px;
        height: 11px;
        border-radius: 99px;
        background: var(--text-muted);
        top: 2px;
        left: 2px;
      }
      .sub .toggle.on {
        background: var(--accent-dim);
        border-color: var(--accent);
      }
      .sub .toggle.on::after {
        left: auto;
        right: 2px;
        background: var(--accent);
      }
      .errbox {
        margin: 2px 0 8px 30px;
        padding: 8px 11px;
        border-radius: var(--r-sm);
        background: rgba(247, 118, 142, 0.09);
        border: 1px solid rgba(247, 118, 142, 0.28);
        font-size: var(--fs-xs);
        color: #f0a3b3;
        line-height: 1.75;
      }
      .pal {
        display: flex;
        gap: 7px;
        align-items: center;
        margin: 2px 0 8px 30px;
      }
      .pal .lb {
        font-size: 10.5px;
        color: var(--text-muted);
        margin-right: 4px;
      }
      .pal .sw2 {
        width: 16px;
        height: 16px;
        border-radius: 99px;
        border: 2px solid transparent;
      }
      .pal .sw2.on {
        border-color: var(--text-primary);
      }

      /* 한 줄 입력 */
      .scrim {
        position: fixed;
        inset: 0;
        background: rgba(8, 9, 12, 0.62);
      }
      .dlg {
        position: fixed;
        left: 50%;
        top: 74px;
        transform: translateX(-50%);
        width: min(620px, 88%);
        background: var(--bg-raised);
        border: 1px solid var(--border-focus);
        border-radius: var(--r-md);
        box-shadow: var(--shadow-pop);
        padding: 13px 15px 14px;
      }
      .dlg label {
        display: block;
        font-size: var(--fs-xs);
        color: var(--text-muted);
        margin-bottom: 7px;
      }
      .dlg input {
        width: 100%;
        background: var(--bg-inset);
        border: 1px solid var(--border);
        border-radius: var(--r-sm);
        padding: 9px 11px;
        font-size: var(--fs-md);
        color: var(--text-primary);
        font-family: inherit;
        outline: none;
      }
      .dlg input:focus {
        border-color: var(--border-focus);
      }
      .dlg .parse {
        margin-top: 10px;
        padding: 9px 11px;
        border-radius: var(--r-sm);
        background: var(--bg-inset);
        border: 1px solid var(--border);
        font-size: var(--fs-xs);
        color: var(--text-secondary);
        line-height: 1.85;
        min-height: 36px;
      }
      .dlg .parse b {
        color: var(--accent);
      }
      .dlg .parse .q {
        color: var(--warning);
      }
      .dlg .parse .no {
        color: var(--text-muted);
      }
      .dlg .foot {
        display: flex;
        gap: 11px;
        margin-top: 10px;
        font-size: var(--fs-xs);
        color: var(--text-muted);
      }

      /* 키맵 */
      .keys {
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: min(620px, 90%);
        background: var(--bg-raised);
        border: 1px solid var(--border);
        border-radius: var(--r-md);
        box-shadow: var(--shadow-pop);
        overflow: hidden;
      }
      .keys .kh {
        display: flex;
        align-items: baseline;
        padding: 11px 15px;
        border-bottom: 1px solid var(--border);
        font-size: var(--fs-sm);
        font-weight: 650;
      }
      .keys .kh span {
        font-size: var(--fs-xs);
        color: var(--text-muted);
        font-weight: 400;
        margin-left: auto;
      }
      .keys .kbody {
        padding: 11px 15px 15px;
        columns: 2;
        column-gap: 26px;
      }
      .keys .kgrp {
        font-size: 11px;
        color: var(--text-muted);
        font-weight: 640;
        margin: 9px 0 5px;
        break-inside: avoid;
      }
      .keys .krow {
        display: flex;
        align-items: baseline;
        gap: 9px;
        padding: 2.5px 0;
        font-size: var(--fs-xs);
        break-inside: avoid;
      }
      .keys .krow span {
        color: var(--text-secondary);
      }
      .keys .krow kbd {
        flex: none;
        min-width: 26px;
        text-align: center;
      }

      .toast {
        position: fixed;
        left: 50%;
        bottom: 46px;
        transform: translateX(-50%);
        background: var(--bg-raised);
        border: 1px solid var(--border);
        border-radius: 99px;
        padding: 7px 16px;
        font-size: var(--fs-xs);
        box-shadow: var(--shadow-pop);
        display: flex;
        align-items: center;
        gap: 8px;
        opacity: 0;
        transition: opacity 0.25s ease;
        pointer-events: none;
      }
      .toast.show {
        opacity: 1;
      }
      .toast .dot {
        width: 7px;
        height: 7px;
        border-radius: 99px;
        background: var(--success);
      }
      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header>
        <span class="title">WHENCALENDAR</span>
        <nav class="tabs" id="tabs"></nav>
        <span class="date" id="dateLabel"></span>
        <div class="winbtns">
          <button id="winMin" title="최소화">
            <svg width="12" height="12" viewBox="0 0 12 12" stroke="currentColor" stroke-width="1.2">
              <path d="M1 6h10"></path>
            </svg>
          </button>
          <button id="winClose" title="닫기 (트레이에 남습니다)">
            <svg width="12" height="12" viewBox="0 0 12 12" stroke="currentColor" stroke-width="1.2">
              <path d="M1.5 1.5l9 9M10.5 1.5l-9 9"></path>
            </svg>
          </button>
        </div>
      </header>
      <div class="body" id="body"></div>
      <footer>
        <span><span class="led" id="led"></span> <span id="storeState">저장소</span></span>
        <span class="foot-hints">
          <span><kbd>N</kbd> 새 일정</span>
          <span><kbd>X</kbd> 삭제</span>
          <span><kbd>?</kbd> 키</span>
        </span>
      </footer>
    </div>

    <div class="scrim hidden" id="scrim"></div>

    <div class="dlg hidden" id="dlg">
      <label>새 일정 — 한 줄로 적으세요</label>
      <input id="dlgIn" type="text" maxlength="200" placeholder="담주 화 3시 김부장 미팅 1시간" />
      <div class="parse" id="dlgParse"><span class="no">날짜·시각·제목을 알아서 읽습니다</span></div>
      <div class="foot">
        <span><kbd>Enter</kbd> 등록</span><span><kbd>Esc</kbd> 취소</span>
      </div>
    </div>

    <div class="keys hidden" id="keys">
      <div class="kh">키<span>? · Esc 로 닫기</span></div>
      <div class="kbody">
        <div class="kgrp">이동</div>
        <div class="krow"><kbd>Tab</kbd><span>탭 전환</span></div>
        <div class="krow"><kbd>j</kbd><kbd>k</kbd><span>위아래</span></div>
        <div class="krow"><kbd>←</kbd><kbd>→</kbd><span>날짜·주·달 이동</span></div>
        <div class="krow"><kbd>hjkl</kbd><span>월 격자에서 날짜 옮기기</span></div>
        <div class="krow"><kbd>t</kbd><span>오늘로</span></div>
        <div class="kgrp">일정</div>
        <div class="krow"><kbd>N</kbd><span>새 일정 (한 줄)</span></div>
        <div class="krow"><kbd>X</kbd><span>삭제</span></div>
        <div class="krow"><kbd>U</kbd><span>되돌리기</span></div>
        <div class="kgrp">구독 탭</div>
        <div class="krow"><kbd>A</kbd><span>.ics 주소 추가</span></div>
        <div class="krow"><kbd>R</kbd><span>지금 받아오기</span></div>
        <div class="krow"><kbd>Space</kbd><span>켜기·끄기</span></div>
        <div class="krow"><kbd>C</kbd><span>색 바꾸기</span></div>
        <div class="krow"><kbd>X</kbd><span>구독 삭제</span></div>
        <div class="kgrp">창</div>
