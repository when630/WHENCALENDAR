<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link href="../../renderer/tokens.css" rel="stylesheet" />
    <title>월 격자 — 기간 일정 표시 대안</title>
    <style>
      /* 비교용 목업. 같은 2주치 데이터를 다섯 가지 방식으로 그린다.
         칸 크기·색·글꼴은 실제 앱(renderer/main.html)과 같게 맞췄다. */
      body {
        background: var(--bg-app);
        color: var(--text-primary);
        font-family: var(--font-sans);
        font-size: var(--fs-md);
        line-height: 1.5;
        margin: 0;
        padding: 28px 32px 60px;
      }
      h1 {
        font-size: 17px;
        font-weight: 700;
        letter-spacing: 0.3px;
      }
      .lead {
        color: var(--text-muted);
        font-size: var(--fs-sm);
        margin: 6px 0 4px;
        line-height: 1.8;
      }
      .opt {
        margin-top: 34px;
        border-top: 1px solid var(--border);
        padding-top: 18px;
      }
      .opt h2 {
        font-size: var(--fs-md);
        font-weight: 650;
        margin: 0;
        display: flex;
        align-items: baseline;
        gap: 9px;
      }
      .opt h2 b {
        font-size: var(--fs-xs);
        font-weight: 700;
        color: var(--accent);
        background: var(--accent-dim);
        border-radius: 99px;
        padding: 1px 9px;
      }
      .opt .why {
        color: var(--text-secondary);
        font-size: var(--fs-sm);
        margin: 7px 0 3px;
      }
      .opt .tradeoff {
        color: var(--text-muted);
        font-size: var(--fs-xs);
        margin-bottom: 13px;
      }
      .opt .tradeoff b {
        color: var(--warning);
        font-weight: 500;
      }

      /* ── 공통 격자 (실제 앱과 같은 치수) */
      .mon {
        width: 900px;
      }
      .dow {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 4px;
        padding-bottom: 5px;
      }
      .dow span {
        text-align: center;
        font-size: 11px;
        color: var(--text-muted);
      }
      .dow span.we {
        color: #8a6f78;
      }
      .cells {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .wkrow {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 4px;
        height: 84px;
      }
      .c {
        grid-row: 1;
        background: var(--bg-inset);
        border: 1px solid transparent;
        border-radius: var(--r-sm);
        padding: 3px 5px;
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-height: 0;
        overflow: hidden;
        position: relative;
      }
      .c.we .dnum {
        color: #8a6f78;
      }
      .c.today {
        background: rgba(122, 162, 247, 0.08);
      }
      .c.today .dnum {
        color: #16171c;
        background: var(--accent);
        font-weight: 750;
      }
      .dnum {
        font-size: 12px;
        color: var(--text-secondary);
        font-variant-numeric: tabular-nums;
        flex: none;
        align-self: flex-start;
        min-width: 17px;
        text-align: center;
        border-radius: 99px;
        padding: 0 4px;
        line-height: 16px;
      }
      .pin {
        display: flex;
        flex: none;
        align-items: center;
        gap: 5px;
        font-size: 10.5px;
        color: var(--text-secondary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        line-height: 1.4;
      }
      .pin i {
        width: 3px;
        height: 9px;
        border-radius: 2px;
        flex: none;
      }
      .plus {
        font-size: 10.5px;
        color: var(--text-muted);
        flex: none;
        line-height: 1.4;
      }

      /* ── 지금 방식·5안이 함께 쓰는 가로 막대 */
      .span {
        grid-row: 1;
        z-index: 2;
        align-self: start;
        height: 15px;
        display: flex;
        align-items: center;
        gap: 5px;
        padding: 0 7px;
        border-radius: 4px;
        box-shadow: 0 0 0 1px var(--bg-app);
        font-size: 10px;
        font-weight: 650;
        white-space: nowrap;
        overflow: hidden;
        color: #15171c;
      }
      .span .ar {
        width: 0;
        height: 0;
        flex: none;
        border-style: solid;
        opacity: 0.5;
      }
      .span .ar.l {
        border-width: 3.5px 4px 3.5px 0;
        border-color: transparent currentColor transparent transparent;
      }
      .span .ar.r {
        border-width: 3.5px 0 3.5px 4px;
        border-color: transparent transparent transparent currentColor;
      }
      .span.contL {
        border-top-left-radius: 0;
        border-bottom-left-radius: 0;
        padding-left: 5px;
      }
      .span.contR {
        border-top-right-radius: 0;
        border-bottom-right-radius: 0;
        padding-right: 5px;
      }
      .morespan {
        grid-row: 1;
        z-index: 3;
        align-self: start;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        padding-right: 3px;
      }
      .morespan span {
        font-size: 10px;
        font-weight: 650;
        color: var(--text-secondary);
        background: var(--bg-app);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 0 5px;
        line-height: 13px;
      }

      /* ── 1안: 기간 레일 — 칸 위에 따로 난 트랙 */
      .v1 .wkrow {
        height: auto;
        display: block;
      }
      .v1 .rail {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 4px;
        padding-bottom: 3px;
      }
      .v1 .rail .bar {
        grid-row: var(--r);
        height: 15px;
        border-radius: 4px;
        display: flex;
        align-items: center;
        gap: 5px;
        padding: 0 7px;
        font-size: 10px;
        font-weight: 650;
        white-space: nowrap;
        overflow: hidden;
        color: #15171c;
      }
      .v1 .rail .bar.contL {
        border-top-left-radius: 0;
        border-bottom-left-radius: 0;
      }
      .v1 .rail .bar.contR {
        border-top-right-radius: 0;
        border-bottom-right-radius: 0;
      }
      .v1 .grid {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 4px;
        height: 84px;
      }

      /* ── 2안: 칸 안 조각 */
      .v2 .seg {
        display: flex;
        flex: none;
        align-items: center;
        gap: 5px;
        height: 14px;
        border-radius: 3px;
        padding: 0 5px;
        font-size: 10px;
        font-weight: 650;
        color: #15171c;
        white-space: nowrap;
        overflow: hidden;
      }
      .v2 .seg.mid {
        opacity: 0.5;
      }
      .v2 .seg.mid::after {
        content: '';
      }

      /* ── 3안: 가장자리 띠 */
      .v3 .c {
        padding-top: 3px;
      }
      .v3 .edges {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        display: flex;
        flex-direction: column;
        gap: 1px;
        z-index: 1;
      }
      .v3 .edges i {
        height: 3px;
      }
      .v3 .edges i.head {
        border-top-left-radius: 3px;
        border-bottom-left-radius: 3px;
      }
      .v3 .edges i.tail {
        border-top-right-radius: 3px;
        border-bottom-right-radius: 3px;
      }
      .v3 .headline {
        display: flex;
        align-items: center;
        gap: 5px;
        font-size: 10px;
        font-weight: 650;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        flex: none;
        line-height: 1.4;
      }

      /* ── 4안: 칸 배경 틴트 */
      .v4 .tintwrap {
        position: absolute;
        inset: 0;
        z-index: 0;
      }
      .v4 .tint {
        position: absolute;
        inset: 0;
      }
      .v4 .stack {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        display: flex;
        z-index: 1;
      }
      .v4 .stack i {
        width: 3px;
      }
      .v4 .c > * {
        position: relative;
        z-index: 2;
      }
      .v4 .label {
        font-size: 10px;
        font-weight: 650;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        flex: none;
        line-height: 1.4;
      }

      /* ── 6·7·8안: 두꺼운 막대 대신 얇은 선 */
      .thin {
        grid-row: 1;
        z-index: 2;
        align-self: start;
        height: 3px;
        border-radius: 99px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .thin.bottom {
        align-self: end;
      }
      .thin.faint {
        opacity: 0.55;
      }
      .thin em {
        width: 7px;
        height: 7px;
        border-radius: 99px;
        background: inherit;
        flex: none;
      }
      .thin em.off {
        visibility: hidden;
      }
      .nm {
        display: flex;
        align-items: center;
        gap: 5px;
        font-size: 10.5px;
        font-weight: 650;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        flex: none;
        line-height: 1.4;
      }
      .nm b {
        font-weight: 650;
        opacity: 0.6;
      }

      .note {
        color: var(--text-muted);
        font-size: var(--fs-xs);
        margin-top: 9px;
      }
      .legend {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        font-size: var(--fs-xs);
        color: var(--text-muted);
        margin: 14px 0 0;
      }
      .legend span {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .legend i {
        width: 9px;
        height: 9px;
        border-radius: 2px;
      }
    </style>
  </head>
  <body>
    <h1>월 격자 — 여러 날에 걸친 일정을 어떻게 보일까</h1>
    <p class="lead">
      같은 2주(9/14–9/27)를 다섯 가지로 그렸다. 일부러 어려운 배치를 넣었다 —
      한 주에 기간 일정이 <b>네 개</b> 겹치고, 그중 하나는 주 경계를 넘어간다.
    </p>
    <div class="legend" id="legend"></div>

    <div id="out"></div>

    <script>
      // ── 같은 데이터, 다섯 가지 그림
      const DAY = 86400000;
      const d = (n) => new Date(2026, 8, n); // 9월 n일
      const key = (x) => `${x.getMonth()}-${x.getDate()}`;

      // from·to 모두 포함(사람이 말하는 마지막 날)
      const SPANS = [
        { title: '전사 워크숍', from: d(14), to: d(17), color: 3 },
        { title: '고객사 상주', from: d(15), to: d(19), color: 6 },
        { title: '채용 주간', from: d(16), to: d(18), color: 4 },
        { title: '감사 준비', from: d(17), to: d(22), color: 5 },
        { title: '출장', from: d(24), to: d(26), color: 1 },
      ];
      const SINGLES = [
        { title: '스탠드업', at: d(14), hm: '09:30', color: 3 },
        { title: '1:1 미팅', at: d(16), hm: '14:00', color: 6 },
        { title: '디자인 리뷰', at: d(18), hm: '15:30', color: 5 },
        { title: '릴리스 점검', at: d(18), hm: '18:00', color: 2 },
        { title: '주간 보고', at: d(20), hm: '16:00', color: 1 },
        { title: '월간 결산', at: d(24), hm: '14:00', color: 4 },
        { title: '세미나', at: d(25), hm: '13:00', color: 3 },
        { title: '회고', at: d(25), hm: '17:00', color: 2 },
      ];
      const TODAY = d(18);
      const WEEKS = [d(14), d(21)]; // 각 주의 월요일

      const singlesOf = (day) => SINGLES.filter((s) => key(s.at) === key(day));
      const addDays = (x, n) => new Date(x.getFullYear(), x.getMonth(), x.getDate() + n);
      const colOf = (day, weekStart) => Math.round((day - weekStart) / DAY);

      // 한 주와 겹치는 기간 일정을 열 번호와 함께
      function spansOfWeek(weekStart) {
        const weekEnd = addDays(weekStart, 6);
        return SPANS.filter((s) => s.from <= weekEnd && s.to >= weekStart)
          .sort((a, b) => b.to - b.from - (a.to - a.from) || a.from - b.from)
          .map((s) => ({
            ...s,
            col0: Math.max(0, colOf(s.from, weekStart)),
            col1: Math.min(6, colOf(s.to, weekStart)),
            contL: s.from < weekStart,
            contR: s.to > weekEnd,
          }));
      }

      // 겹치지 않는 것끼리 같은 줄에 눕힌다
      function toLanes(list, max) {
        const lanes = [];
        const over = [];
        for (const s of list) {
          let put = false;
          for (const L of lanes) {
            if (L.every((x) => x.col1 < s.col0 || x.col0 > s.col1)) {
              L.push(s);
              put = true;
              break;
            }
          }
          if (put) continue;
          if (lanes.length < max) lanes.push([s]);
          else over.push(s);
        }
        return { lanes, over };
      }

      const el = (tag, cls, text) => {
        const n = document.createElement(tag);
        if (cls) n.className = cls;
        if (text != null) n.textContent = text;
        return n;
      };

      function cell(day, weekStart) {
        const c = el('div', 'c');
        c.style.gridColumn = `${colOf(day, weekStart) + 1} / ${colOf(day, weekStart) + 2}`;
        if (day.getDay() === 0 || day.getDay() === 6) c.classList.add('we');
        if (key(day) === key(TODAY)) c.classList.add('today');
        c.append(el('span', 'dnum', String(day.getDate())));
        return c;
      }

      function pinsInto(c, day, room) {
        const list = singlesOf(day);
        list.slice(0, room).forEach((s) => {
          const p = el('span', 'pin');
          const i = el('i');
          i.style.background = `var(--cal-${s.color})`;
          p.append(i, document.createTextNode(s.title));
          c.append(p);
        });
        if (list.length > room) c.append(el('span', 'plus', `+${list.length - room}`));
      }

      function dowHead() {
        const h = el('div', 'dow');
        ['월', '화', '수', '목', '금', '토', '일'].forEach((x, i) => {
          const s = el('span', i >= 5 ? 'we' : null, x);
          h.append(s);
        });
        return h;
      }

      // ── 0안: 지금 방식 (레인 2줄 + 주 끝에 +N)
      function vNow(root) {
        const cells = el('div', 'cells');
        for (const w of WEEKS) {
          const row = el('div', 'wkrow');
          const { lanes, over } = toLanes(spansOfWeek(w), 2);
          for (let i = 0; i < 7; i++) {
            const day = addDays(w, i);
            const c = cell(day, w);
            const lv = lanes.findIndex((L) => L.some((s) => i >= s.col0 && i <= s.col1));
            const covered = lanes.map((L, li) => (L.some((s) => i >= s.col0 && i <= s.col1) ? li : -1)).filter((x) => x >= 0);
            const need = over.length && i === 6 ? 2 : covered.length ? Math.max(...covered) + 1 : 0;
            if (need) {
              c.style.paddingTop = `${need === 2 ? 54 : 36}px`;
              c.querySelector('.dnum').style.cssText = 'position:absolute;top:3px;left:5px';
            }
            pinsInto(c, day, 3);
            row.append(c);
          }
          lanes.forEach((L, li) => {
            for (const s of L) {
              const b = el('div', 'span' + (s.contL ? ' contL' : '') + (s.contR ? ' contR' : ''));
              b.style.gridColumn = `${s.col0 + 1}/${s.col1 + 2}`;
              b.style.background = `var(--cal-${s.color})`;
              b.style.marginTop = `${18 + li * 18}px`;
              if (s.contL) b.append(el('span', 'ar l'));
              b.append(document.createTextNode(s.title));
              if (s.contR) b.append(el('span', 'ar r'));
              row.append(b);
            }
          });
          if (over.length) {
            const m = el('div', 'morespan');
            m.style.gridColumn = '7/8';
            m.style.marginTop = '36px';
            m.append(el('span', null, `+${over.length}`));
            row.append(m);
          }
          cells.append(row);
        }
        root.append(dowHead(), cells);
      }

      // ── 1안: 기간 레일 (칸 밖 트랙)
      function v1(root) {
        const cells = el('div', 'cells');
        for (const w of WEEKS) {
          const row = el('div', 'wkrow');
          const { lanes } = toLanes(spansOfWeek(w), 9);
          if (lanes.length) {
            const rail = el('div', 'rail');
            lanes.forEach((L, li) => {
              for (const s of L) {
                const b = el('div', 'bar' + (s.contL ? ' contL' : '') + (s.contR ? ' contR' : ''));
                b.style.gridColumn = `${s.col0 + 1}/${s.col1 + 2}`;
                b.style.setProperty('--r', String(li + 1));
                b.style.background = `var(--cal-${s.color})`;
                if (s.contL) b.append(el('span', 'ar l'));
                b.append(document.createTextNode(s.title));
                if (s.contR) b.append(el('span', 'ar r'));
                rail.append(b);
              }
            });
            rail.style.gap = '4px';
            rail.style.rowGap = '2px';
            row.append(rail);
          }
          const grid = el('div', 'grid');
          for (let i = 0; i < 7; i++) {
            const day = addDays(w, i);
            const c = cell(day, w);
            pinsInto(c, day, 3);
            grid.append(c);
          }
          row.append(grid);
          cells.append(row);
        }
        root.append(dowHead(), cells);
      }

      // ── 2안: 칸 안 조각
      function v2(root) {
        const cells = el('div', 'cells');
        for (const w of WEEKS) {
          const row = el('div', 'wkrow');
          for (let i = 0; i < 7; i++) {
            const day = addDays(w, i);
            const c = cell(day, w);
            const here = spansOfWeek(w).filter((s) => i >= s.col0 && i <= s.col1);
            for (const s of here) {
              const head = key(day) === key(s.from);
              const seg = el('div', 'seg' + (head ? '' : ' mid'));
              seg.style.background = `var(--cal-${s.color})`;
              seg.textContent = head ? s.title : '';
              c.append(seg);
            }
            pinsInto(c, day, Math.max(0, 3 - here.length));
            row.append(c);
          }
          cells.append(row);
        }
        root.append(dowHead(), cells);
      }

      // ── 3안: 가장자리 띠 + 첫날에만 제목
      function v3(root) {
        const cells = el('div', 'cells');
        for (const w of WEEKS) {
          const row = el('div', 'wkrow');
          for (let i = 0; i < 7; i++) {
            const day = addDays(w, i);
            const c = cell(day, w);
            const here = spansOfWeek(w).filter((s) => i >= s.col0 && i <= s.col1);
            if (here.length) {
              const edges = el('div', 'edges');
              for (const s of here) {
                const bar = el('i', (key(day) === key(s.from) ? 'head ' : '') + (key(day) === key(s.to) ? 'tail' : ''));
                bar.style.background = `var(--cal-${s.color})`;
                edges.append(bar);
              }
              c.append(edges);
              c.style.paddingTop = `${3 + here.length * 4}px`;
              for (const s of here) {
                if (key(day) !== key(s.from) && !(s.contL && i === 0)) continue;
                const h = el('div', 'headline');
                h.style.color = `var(--cal-${s.color})`;
                h.textContent = (s.contL && i === 0 ? '… ' : '') + s.title;
                c.append(h);
              }
            }
            pinsInto(c, day, Math.max(1, 3 - here.length));
            row.append(c);
          }
          cells.append(row);
        }
        root.append(dowHead(), cells);
      }

      // ── 4안: 칸 배경 틴트 + 왼쪽 색 스택
      function v4(root) {
        const cells = el('div', 'cells');
        for (const w of WEEKS) {
          const row = el('div', 'wkrow');
          for (let i = 0; i < 7; i++) {
            const day = addDays(w, i);
            const c = cell(day, w);
            const here = spansOfWeek(w).filter((s) => i >= s.col0 && i <= s.col1);
            if (here.length) {
              const wrap = el('div', 'tintwrap');
              const tint = el('div', 'tint');
              tint.style.background = `color-mix(in srgb, var(--cal-${here[0].color}) 14%, transparent)`;
              wrap.append(tint);
              const stack = el('div', 'stack');
              for (const s of here) {
                const i2 = el('i');
                i2.style.background = `var(--cal-${s.color})`;
                stack.append(i2);
              }
              wrap.append(stack);
              c.prepend(wrap);
              c.style.paddingLeft = `${5 + here.length * 3}px`;
              for (const s of here) {
                if (key(day) !== key(s.from) && !(s.contL && i === 0)) continue;
                const l = el('div', 'label');
                l.style.color = `var(--cal-${s.color})`;
                l.textContent = (s.contL && i === 0 ? '… ' : '') + s.title;
                c.append(l);
              }
            }
            pinsInto(c, day, Math.max(1, 3 - here.length));
            row.append(c);
          }
          cells.append(row);
        }
        root.append(dowHead(), cells);
      }

      // ── 5안: 지금 방식 + 레인 3줄 + 넘친 것은 그 날 칸에
      function v5(root) {
        const cells = el('div', 'cells');
        for (const w of WEEKS) {
          const row = el('div', 'wkrow');
          const { lanes, over } = toLanes(spansOfWeek(w), 3);
          const overOn = (i) => over.filter((s) => i >= s.col0 && i <= s.col1).length;
          for (let i = 0; i < 7; i++) {
            const day = addDays(w, i);
            const c = cell(day, w);
            const covered = lanes.map((L, li) => (L.some((s) => i >= s.col0 && i <= s.col1) ? li : -1)).filter((x) => x >= 0);
            const need = covered.length ? Math.max(...covered) + 1 : 0;
            if (need) {
              c.style.paddingTop = `${18 + need * 17}px`;
              c.querySelector('.dnum').style.cssText = 'position:absolute;top:3px;left:5px';
            }
            const n = overOn(i);
            if (n) c.append(el('span', 'plus', `+${n}건 더`));
            pinsInto(c, day, 2);
            row.append(c);
          }
          lanes.forEach((L, li) => {
            for (const s of L) {
              const b = el('div', 'span' + (s.contL ? ' contL' : '') + (s.contR ? ' contR' : ''));
              b.style.gridColumn = `${s.col0 + 1}/${s.col1 + 2}`;
              b.style.background = `var(--cal-${s.color})`;
              b.style.marginTop = `${19 + li * 17}px`;
              if (s.contL) b.append(el('span', 'ar l'));
              b.append(document.createTextNode(s.title));
              if (s.contR) b.append(el('span', 'ar r'));
              row.append(b);
            }
          });
          cells.append(row);
        }
        root.append(dowHead(), cells);
      }

      // 선 하나가 먹는 세로 공간
      const LINE = 5;

      // 6·7·8안 공통 — 얇은 선으로 잇고, 이름은 시작 칸 안에 글자로
      function thinBase(root, opt) {
        const cells = el('div', 'cells');
        for (const w of WEEKS) {
          const row = el('div', 'wkrow');
          const { lanes } = toLanes(spansOfWeek(w), 9);
          const reserve = lanes.length * LINE + 2;

          for (let i = 0; i < 7; i++) {
            const day = addDays(w, i);
            const c = cell(day, w);
            if (lanes.length) c.style[opt.bottom ? 'paddingBottom' : 'paddingTop'] = `${reserve}px`;

            // 이 칸에서 시작하는 기간 — 주가 바뀌어 이어지는 것은 그 주 첫 칸에 적는다
            for (const s of lanes.flat().sort((a, b) => a.col0 - b.col0)) {
              if (i !== s.col0) continue;
              const nm = el('div', 'nm');
              nm.style.color = `var(--cal-${s.color})`;
              if (s.contL) nm.append(el('b', null, '… '));
              nm.append(document.createTextNode(s.title));
              c.append(nm);
            }
            pinsInto(c, day, 2);
            row.append(c);
          }

          lanes.forEach((L, li) => {
            for (const s of L) {
              const t = el('div', 'thin' + (opt.bottom ? ' bottom' : '') + (opt.faint ? ' faint' : ''));
              t.style.gridColumn = `${s.col0 + 1}/${s.col1 + 2}`;
              t.style.background = `var(--cal-${s.color})`;
              t.style[opt.bottom ? 'marginBottom' : 'marginTop'] = `${3 + li * LINE}px`;
              if (opt.dots) {
                const a = el('em', s.contL ? 'off' : null);
                const b = el('em', s.contR ? 'off' : null);
                a.style.background = b.style.background = `var(--cal-${s.color})`;
                t.append(a, b);
              }
              row.append(t);
            }
          });
          cells.append(row);
        }
        root.append(dowHead(), cells);
      }

      const v6 = (root) => thinBase(root, {});
      const v7 = (root) => thinBase(root, { dots: true });
      const v8 = (root) => thinBase(root, { bottom: true, faint: true });

      const OPTIONS = [
        {
          tag: '지금',
          name: '가로 막대 · 레인 2줄',
          why: '막대가 칸 위를 가로질러 이어짐이 한눈에 보인다.',
          tradeoff:
            '<b>레인이 2줄뿐</b>이라 셋째부터는 그 주 일요일 칸에 +N으로 밀리고, 어느 날 것인지 알 수 없다. 막대가 지나가는 칸은 위를 최대 54px 비워서 그날 개별 일정이 가려진다.',
          draw: vNow,
        },
        {
          tag: '1안',
          name: '기간 레일 — 칸 밖에 따로',
          why:
            '막대를 칸 위가 아니라 <b>주 행 위 별도 트랙</b>에 그린다. 칸 안쪽을 한 픽셀도 잡아먹지 않으므로 개별 일정이 가려지지 않고, 레인 수 제한도 없앨 수 있다.',
          tradeoff: '기간이 많은 주는 그 주 칸이 눌려 낮아진다. 주마다 높이가 달라진다.',
          draw: v1,
        },
        {
          tag: '2안',
          name: '칸 안 조각',
          why: '기간을 각 날짜 칸 안에 한 줄씩 넣는다. 첫날에만 제목, 이어지는 날은 색만. 레이아웃이 단순해 어긋날 일이 없다.',
          tradeoff: '<b>이어짐이 약하다.</b> 칸 사이 간격 때문에 한 일정인지 여러 개인지 헷갈린다.',
          draw: v2,
        },
        {
          tag: '3안',
          name: '가장자리 띠',
          why: '칸 위쪽에 3px 색 띠만 긋고 제목은 첫날(과 주가 바뀌는 칸)에만. 공간을 거의 안 먹어 기간이 많아도 칸이 버틴다.',
          tradeoff: '띠만으로는 무슨 일정인지 모른다. 이름을 보려면 첫날을 찾아가야 한다.',
          draw: v3,
        },
        {
          tag: '4안',
          name: '배경 틴트 + 왼쪽 색 스택',
          why: '기간이 덮는 칸을 옅게 칠하고 왼쪽에 색을 쌓는다. "이 날은 워크숍 기간"이 배경으로 읽힌다.',
          tradeoff: '<b>겹치면 색이 섞여 읽기 어렵다.</b> 오늘·선택 칸 강조와도 배경을 두고 다툰다.',
          draw: v4,
        },
        {
          tag: '5안',
          name: '지금 방식 + 레인 3줄 · 넘침을 제자리에',
          why: '구조는 그대로 두고 레인을 3줄로 늘리고, 넘친 것은 그 주 끝이 아니라 <b>실제로 걸친 날 칸</b>에 "+n건 더"로 적는다. 손대는 곳이 가장 적다.',
          tradeoff: '레인이 3줄이면 칸 위 51px을 비운다 — 기간이 많은 주는 여전히 답답하다.',
          draw: v5,
        },
        {
          tag: '6안',
          name: '얇은 선 + 이름은 칸 안 글자로',
          why:
            '막대를 <b>3px 선</b>으로 줄이고, 이름은 시작한 칸 안에 그 색 글자로 적는다. 선 넷이 겹쳐도 칸 위를 22px만 쓴다 — 지금 막대 하나(36px)보다 적다. 이름이 개별 일정과 같은 줄 리듬에 놓여 한 칸이 한 덩어리로 읽힌다.',
          tradeoff: '선만 보고는 어느 일정인지 모른다. 이름을 보려면 시작한 칸을 눈으로 따라가야 한다.',
          draw: v6,
        },
        {
          tag: '7안',
          name: '얇은 선 + 시작·끝에 점',
          why:
            '6안에 <b>시작과 끝만 점</b>을 찍는다. 점이 없는 쪽은 주 경계를 넘어 이어진다는 뜻이라, 세모 화살표 없이도 이어짐과 끝맺음이 구별된다.',
          tradeoff: '점이 선보다 두꺼워 칸 위 여백이 조금 더 필요하다.',
          draw: v7,
        },
        {
          tag: '8안',
          name: '얇은 선을 칸 아래에',
          why:
            '같은 선을 칸 <b>바닥</b>에 깐다. 날짜와 그날 일정이 늘 맨 위에서 시작하므로 칸을 읽는 리듬이 기간 일정 유무에 흔들리지 않는다. 선은 옅게 깔아 배경처럼 둔다.',
          tradeoff: '아래로 갈수록 눈에 덜 띈다. 기간이 "그날의 배경"이라는 성격이 강해진다.',
          draw: v8,
        },
      ];

      const out = document.getElementById('out');
      for (const o of OPTIONS) {
        const box = el('div', 'opt');
        const h = el('h2');
        h.append(el('b', null, o.tag), document.createTextNode(o.name));
        const why = el('p', 'why');
        why.innerHTML = o.why;
        const tr = el('p', 'tradeoff');
        tr.innerHTML = o.tradeoff;
        const mon = el('div', `mon ${o.tag === '지금' ? 'vnow' : 'v' + o.tag[0]}`);
        o.draw(mon);
        box.append(h, why, tr, mon);
        out.append(box);
      }

      const lg = document.getElementById('legend');
      for (const s of SPANS) {
        const w = el('span');
        const i = el('i');
        i.style.background = `var(--cal-${s.color})`;
        w.append(i, document.createTextNode(`${s.title} ${s.from.getDate()}–${s.to.getDate()}일`));
        lg.append(w);
      }
    </script>
  </body>
</html>
